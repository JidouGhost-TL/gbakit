[workspace]
resolver = "2"
members = [
    "crates/gba-rom",
    "crates/gba-compress",
    "crates/gba-gfx",
    "crates/gba-sound",
    "crates/gba-text",
    "crates/gba-save",
    "crates/gba-saves",
    "crates/gba-patches",
    "crates/gbakit",
    "crates/gbakit-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
formatkit-core = "0.1.19"
formatkit-layout = "0.1.19"
formatkit-pixel = "0.1.19"
formatkit-codec = "0.1.19"
formatkit-patch = "0.1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gba-rom = { path = "crates/gba-rom", version = "=0.2.0" }
gba-compress = { path = "crates/gba-compress", version = "=0.2.0" }
gba-gfx = { path = "crates/gba-gfx", version = "=0.2.0" }
gba-sound = { path = "crates/gba-sound", version = "=0.2.0" }
gba-text = { path = "crates/gba-text", version = "=0.2.0" }
gba-save = { path = "crates/gba-save", version = "=0.2.0" }
gba-saves = { path = "crates/gba-saves", version = "=0.2.0" }
gba-patches = { path = "crates/gba-patches", version = "=0.2.0" }
gbakit = { path = "crates/gbakit", version = "=0.2.0" }
gax = "0.1.3"
musyx = "0.1.3"
m4a = "0.1.1"
krawall = "0.1.1"
konami-kce = "0.1.1"
rare-audio = "0.1.1"
logik-state = "0.1.1"
southpaw-audio = "0.1.1"
rd1-kaede = "0.1.1"
paragon5 = "0.1.1"
ead-sma = "0.1.0"
engine-sw-audio = "0.1.0"
gba-ereader = "0.1.0"
mobiclip = "0.1.0"
cosmigo-sonix = "0.1.0"
natsume-audio = "0.1.0"
delaney-gba = "0.1.0"
fullfat-audio = "0.1.0"
hudson-jp-audio = "0.1.0"
