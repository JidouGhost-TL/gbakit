[workspace]
resolver = "2"
members = [
    "crates/gba-rom",
    "crates/gba-compress",
    "crates/gba-gfx",
    "crates/gba-sound",
    "crates/gba-save",
    "crates/gba-saves",
    "crates/gba-patches",
    "crates/gbakit",
    "crates/gbakit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
formatkit-core = "=0.1.10"
formatkit-layout = "=0.1.10"
formatkit-pixel = "=0.1.10"
formatkit-codec = "=0.1.10"
formatkit-patch = "=0.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gba-rom = { path = "crates/gba-rom", version = "=0.1.0" }
gba-compress = { path = "crates/gba-compress", version = "=0.1.0" }
gba-gfx = { path = "crates/gba-gfx", version = "=0.1.0" }
gba-sound = { path = "crates/gba-sound", version = "=0.1.0" }
gba-save = { path = "crates/gba-save", version = "=0.1.0" }
gba-saves = { path = "crates/gba-saves", version = "=0.1.0" }
gba-patches = { path = "crates/gba-patches", version = "=0.1.0" }
gbakit = { path = "crates/gbakit", version = "=0.1.0" }
gax = { path = "../gax-rs", version = "0.1.1" }
musyx = { path = "../musyx-rs", version = "0.1.1" }
m4a = "0.1.0"
krawall = "0.1.0"
konami-kce = "0.1.0"
rare-audio = "0.1.0"
logik-state = "0.1.0"
southpaw-audio = "0.1.0"
rd1-kaede = "0.1.0"
paragon5 = "0.1.0"
