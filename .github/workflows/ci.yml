name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CLI contract smoke tests
        shell: bash
        run: |
          cargo run -p gbakit-cli -- --version --json > version.json
          cargo run -p gbakit-cli -- capabilities --json > caps.json
          PYTHON="$(command -v python3 || command -v python)"
          "$PYTHON" -c '
          import json
          v = json.load(open("version.json"))
          assert v["schema"] == "formatkit.build-identity.v1", v
          assert v["tool"] == "gbakit", v
          c = json.load(open("caps.json"))
          assert c["schema"] == "formatkit.capabilities.v1", c
          assert c["tool"] == "gbakit", c
          assert len(c["formats"]) > 0, c
          '
